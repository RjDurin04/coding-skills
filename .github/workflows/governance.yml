name: Governance validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned schema validator
        shell: pwsh
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          --requirement requirements-governance.txt

      - name: Run governance aggregate
        shell: pwsh
        run: ./scripts/test-governance.ps1 -Root .
